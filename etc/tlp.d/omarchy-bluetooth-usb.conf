# Keep Intel Bluetooth combo cards awake under TLP USB autosuspend (#12950).
# TLP's udev hook rewrites power/control=auto after ordinary udev rules, which
# drops BLE reconnect advertisements until the peripheral is re-paired.
# Append so earlier user denylist entries survive; /etc/tlp.conf still wins.
USB_DENYLIST+="8087:0a2a 8087:0a2b 8087:0aa7 8087:0aaa 8087:0025 8087:0026 8087:0029 8087:0032 8087:0033 8087:0036 8087:0037"
